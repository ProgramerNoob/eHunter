name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Runtime versions
        run: |
          node --version
          npm --version
          python3 --version
      - name: Install from root lockfile
        run: npm ci --include=dev
      - name: Install Pi SDK for the extension contract tests
        run: npm install --global @earendil-works/pi-coding-agent@1.4.0
      - name: Type check, regressions and production build
        run: npm run check
