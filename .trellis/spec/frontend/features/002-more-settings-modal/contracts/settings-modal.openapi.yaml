openapi: 3.0.3
info:
  title: eHunter Unified Settings Modal Contract
  version: 1.0.0
  description: |
    Logical contract for unified settings modal behaviors inside the reader UI.
    These endpoints describe interaction/state boundaries for implementation planning and testing.
    This is a logical contract for local reader UI behavior; example servers and paths do not represent deployed HTTP endpoints.
    Authoritative behavior is .trellis/spec/frontend/decisions/2026-09-18-reader-behavior.md sections 2-4; implementation and runtime acceptance remain pending.
  x-behavior-notes:
    - GM storage shares preferences across EH/EX/NH within one browser and userscript installation; unavailable GM falls back to origin-local localStorage.
    - For each item, keep a valid shared value, then fill missing or invalid items from current-origin unified legacy settings, then standalone legacy settings, then defaults.
    - With empty shared storage the first site imports its valid legacy items; later sites only fill gaps. Repeated migration must be idempotent.
    - Preserve legacy copies for fallback; when GM returns, valid shared values win over fallback changes. Explicit reset must prevent legacy reimport.
    - Keep every valid page-turn mode including legacy default values. Without a valid migrated mode, reduced-motion initializes none, otherwise desktop realistic or mobile slide.
    - Persist the initialized mode; system changes and unrelated saves do not recompute it. User selection replaces it.
    - Magnifier source size is any integer from 20 to 300 CSS px, default 80; zoom is 2, 3, 4 or 5, default 3. Persist size and zoom using the same shared/fallback rules.
    - Quick size controls use steps of 10, clamp to the boundaries and disable the corresponding boundary button. Settings and quick controls share the same range.
    - Magnifier enabled state is page-session-only; paging and reading-mode changes retain it, while reload or a new page starts disabled. Temporary geometry never changes stored size or zoom.
servers:
  - url: https://ehunter.local
paths:
  /settings/modal:
    get:
      summary: Get unified settings modal payload
      operationId: getSettingsModalPayload
      responses:
        '200':
          description: Current modal categories and settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsModalPayload'
  /settings/preferences:
    patch:
      summary: Update one or more setting values
      operationId: patchSettingsPreferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsPreferencePatch'
      responses:
        '200':
          description: Updated preference snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsPreferenceSnapshot'
  /settings/quick-items:
    patch:
      summary: Update quick setting selection and global order
      operationId: patchQuickSettingItems
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuickSettingsPatch'
      responses:
        '200':
          description: Updated quick settings projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuickSettingsState'
  /settings/factory-reset/confirm:
    post:
      summary: Confirm and execute clear-cache plus reset-settings action
      operationId: confirmFactoryReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FactoryResetConfirmRequest'
      responses:
        '202':
          description: Reset accepted and started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetOperation'
        '409':
          description: Confirmation mismatch or stale state
components:
  schemas:
    SettingsModalPayload:
      type: object
      required:
        - categories
        - settings
        - quickSettings
      properties:
        categories:
          type: array
          items:
            $ref: '#/components/schemas/SettingsCategory'
        settings:
          type: array
          items:
            $ref: '#/components/schemas/SettingItem'
        quickSettings:
          $ref: '#/components/schemas/QuickSettingsState'
    SettingsCategory:
      type: object
      required:
        - id
        - label
        - order
        - anchorId
      properties:
        id:
          type: string
          enum: [general, scroll, book, quick, other]
        label:
          type: string
        order:
          type: integer
        anchorId:
          type: string
    SettingItem:
      type: object
      required:
        - id
        - categoryId
        - label
        - controlType
        - valueType
        - modeScope
      properties:
        id:
          type: string
        categoryId:
          type: string
          enum: [general, scroll, book, quick, other]
        label:
          type: string
        description:
          type: string
          nullable: true
        controlType:
          type: string
          enum: [select, number, toggle, action, readonly]
        valueType:
          type: string
          enum: [string, number, boolean, none]
        currentValue:
          oneOf:
            - type: string
            - type: number
            - type: boolean
            - type: 'null'
        defaultValue:
          oneOf:
            - type: string
            - type: number
            - type: boolean
            - type: 'null'
        modeScope:
          type: string
          enum: [both, scroll-only, book-only]
    SettingsPreferencePatch:
      type: object
      required:
        - updates
      properties:
        updates:
          type: array
          items:
            type: object
            required: [settingItemId, value]
            properties:
              settingItemId:
                type: string
              value:
                oneOf:
                  - type: string
                  - type: number
                  - type: boolean
    QuickSettingsPatch:
      type: object
      required:
        - selectedItemIds
        - globalOrder
      properties:
        selectedItemIds:
          type: array
          items:
            type: string
        globalOrder:
          type: array
          items:
            type: string
    QuickSettingsState:
      type: object
      required:
        - selectedItemIds
        - globalOrder
        - pinnedItemId
      properties:
        selectedItemIds:
          type: array
          items:
            type: string
        globalOrder:
          type: array
          items:
            type: string
        pinnedItemId:
          type: string
          description: Fixed "reading mode" item id, always first.
    SettingsPreferenceSnapshot:
      type: object
      required:
        - schemaVersion
        - updatedAt
        - settings
        - quickSelection
        - quickGlobalOrder
      properties:
        schemaVersion:
          type: integer
        updatedAt:
          type: string
          format: date-time
        settings:
          type: object
          additionalProperties:
            oneOf:
              - type: string
              - type: number
              - type: boolean
        quickSelection:
          type: array
          items:
            type: string
        quickGlobalOrder:
          type: array
          items:
            type: string
    FactoryResetConfirmRequest:
      type: object
      required:
        - confirmed
      properties:
        confirmed:
          type: boolean
          enum: [true]
        confirmationText:
          type: string
          nullable: true
    ResetOperation:
      type: object
      required:
        - type
        - requiresConfirmation
        - status
      properties:
        type:
          type: string
          enum: [factory-reset]
        requiresConfirmation:
          type: boolean
        status:
          type: string
          enum: [idle, confirming, running, success, failed]
        errorMessage:
          type: string
          nullable: true
        confirmedAt:
          type: string
          format: date-time
          nullable: true
