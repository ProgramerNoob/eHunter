openapi: 3.0.3
info:
  title: eHunter Reader Preference Contract
  version: 1.0.0
  description: >-
    Contract for global book-mode page turn animation preference and application behavior.
    This is a logical contract for local reader UI behavior; example servers and paths do not represent deployed HTTP endpoints.
  x-behavior-notes:
    - Authoritative decision is specs/decisions/2026-09-18-reader-behavior.md sections 2 and 3; runtime acceptance is pending.
    - Preserve any valid stored value, including legacy values equal to the old default.
    - Fill missing or invalid shared items from current-origin unified then standalone legacy preferences before computing defaults.
    - Only without a valid migrated value, initialize to none for reduced-motion, otherwise realistic on desktop or slide on mobile.
    - Persist the initialized value; system changes and unrelated saves do not recompute it. A later user selection replaces it.
    - Global means GM storage shared across EH/EX/NH in one browser and userscript installation; unavailable GM falls back to origin-local localStorage.
    - Keep legacy data for fallback, preserve valid shared values when GM returns, make migration idempotent, and prevent legacy reimport after explicit reset.
    - Rapid inputs may be coalesced and reported as coalesced status.
servers:
  - url: https://reader.local
paths:
  /reader/preferences/page-turn-animation:
    get:
      summary: Get global page-turn animation preference
      operationId: getPageTurnAnimationPreference
      responses:
        '200':
          description: Current effective preference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageTurnAnimationPreference'
    put:
      summary: Update global page-turn animation preference
      operationId: updatePageTurnAnimationPreference
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PageTurnAnimationPreferenceUpdate'
      responses:
        '200':
          description: Updated preference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageTurnAnimationPreference'
        '400':
          description: Invalid preference value
  /reader/page-turn:
    post:
      summary: Execute a book-mode page turn
      operationId: applyBookPageTurn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PageTurnRequest'
      responses:
        '200':
          description: Applied page turn result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageTurnResult'
        '409':
          description: Request coalesced by newer intent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageTurnResult'
components:
  schemas:
    AnimationMode:
      type: string
      enum:
        - realistic
        - slide
        - none
    PreferenceScope:
      type: string
      enum:
        - global
    PageTurnAnimationPreference:
      type: object
      required:
        - animationMode
        - scope
        - updatedAt
        - schemaVersion
      properties:
        animationMode:
          $ref: '#/components/schemas/AnimationMode'
        scope:
          $ref: '#/components/schemas/PreferenceScope'
        updatedAt:
          type: string
          format: date-time
        schemaVersion:
          type: integer
          minimum: 1
    PageTurnAnimationPreferenceUpdate:
      type: object
      required:
        - animationMode
      properties:
        animationMode:
          $ref: '#/components/schemas/AnimationMode'
    TurnSource:
      type: string
      enum:
        - click
        - wheel
        - keyboard
        - autoflip
    TurnDirection:
      type: string
      enum:
        - next
        - prev
    TurnStatus:
      type: string
      enum:
        - accepted
        - coalesced
        - ignored_boundary
    PageTurnRequest:
      type: object
      required:
        - source
        - fromIndex
        - toIndex
        - direction
      properties:
        source:
          $ref: '#/components/schemas/TurnSource'
        fromIndex:
          type: integer
          minimum: 0
        toIndex:
          type: integer
          minimum: 0
        direction:
          $ref: '#/components/schemas/TurnDirection'
    PageTurnResult:
      type: object
      required:
        - fromIndex
        - toIndex
        - status
        - animationModeApplied
      properties:
        fromIndex:
          type: integer
          minimum: 0
        toIndex:
          type: integer
          minimum: 0
        status:
          $ref: '#/components/schemas/TurnStatus'
        animationModeApplied:
          $ref: '#/components/schemas/AnimationMode'
